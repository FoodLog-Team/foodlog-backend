server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: FoodLog-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 21MB

  web:
    locale: en
    locale-resolver: fixed

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/foodlog}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: true

    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

security:
  refresh-token:
    expiration: ${REFRESH_TOKEN_EXPIRATION}
    max-amount: ${REFRESH_TOKEN_MAX_AMOUNT}

    cookies:
      path: ${REFRESH_TOKEN_COOKIE_PATH}
      same-site: Strict
      secure: ${REFRESH_TOKEN_COOKIE_SECURE:true}
      max-age: ${REFRESH_TOKEN_MAX_AGE}

storage:
  meal-photos-directory: ${MEAL_PHOTOS_DIRECTORY:./uploads}

groq:
  apiKey: ${GROQ_API_KEY}
  baseUrl: https://api.groq.com/openai/v1
  model: ${GROQ_MODEL:qwen/qwen3.8-27b}

usda:
  api-key: ${USDA_API_KEY}
  base-url: https://api.nal.usda.gov/fdc/v1
