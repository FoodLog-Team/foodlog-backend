spring:
  web:
    locale: en
    locale-resolver: fixed

  datasource:
    url: jdbc:tc:postgresql:17:///foodlog
    username: test
    password: test

jwt:
  secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  expiration: 3600000

security:
  refresh-token:
    expiration: 1h
