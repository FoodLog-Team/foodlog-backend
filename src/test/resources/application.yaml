    cookies:
      path: /api/auth
      same-site: Strict
      secure: false
      max-age: 1h

storage:
  meal-photos-directory: ./uploads

groq:
  apiKey: "groq-test-api-key"
  baseUrl: https://api.groq.com/openai/v1
  model: ${GROQ_MODEL:qwen/qwen3.8-27b}

usda:
  api-key: "usda-test-api-key"
  base-url: https://api.nal.usda.gov/fdc/v1
